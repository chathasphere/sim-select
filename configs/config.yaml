defaults:
  - _self_
  - model: gdn
  - simulator: sir

simulator:
  n_sample: 100

train:
  train_frac: 0.80
  batch_size:
  seed: 11 # random seed for training/validation split
  max_epochs: 20 # 1000
  log_freq: 4
  patience: 20
  stop_early: True
  devices: auto

model:
  lr: 0.001
  weight_decay: 0.0

log: True
fast_dev_run: False


hydra:
  job:
    chdir: True
